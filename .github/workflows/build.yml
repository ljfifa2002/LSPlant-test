name: Build liblsplant.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone DexBuilder dependency
        run: |
          rm -rf LSPlant-6.4/lsplant/src/main/jni/external/dex_builder
          git clone --depth 1 --recurse-submodules \
            https://github.com/LSPosed/DexBuilder.git \
            LSPlant-6.4/lsplant/src/main/jni/external/dex_builder
          echo "DexBuilder: $(ls LSPlant-6.4/lsplant/src/main/jni/external/dex_builder/)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x LSPlant-6.4/gradlew

      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.11718014"

      - name: Upgrade ninja bundled with Android SDK cmake to v1.11
        run: |
          # Android SDK cmake 3.31.5 bundles Ninja 1.10.x which lacks C++20 module
          # support. Replace it with 1.11.1 in-place so Gradle picks up the new version.
          NINJA_VER=1.11.1
          wget -qO /tmp/ninja-linux.zip \
            https://github.com/ninja-build/ninja/releases/download/v${NINJA_VER}/ninja-linux.zip
          sudo unzip -o /tmp/ninja-linux.zip -d ${ANDROID_SDK_ROOT}/cmake/3.31.5/bin/
          ${ANDROID_SDK_ROOT}/cmake/3.31.5/bin/ninja --version

      - name: Build lsplant standalone AAR
        working-directory: LSPlant-6.4
        run: ./gradlew :lsplant:assembleStandalone

      - name: Extract liblsplant.so for arm64-v8a and armeabi-v7a
        working-directory: LSPlant-6.4
        run: |
          AAR=$(find lsplant/build/outputs/aar -name "*standalone*.aar" | head -1)
          echo "AAR: $AAR"
          mkdir -p /tmp/lsplant-out/arm64-v8a /tmp/lsplant-out/armeabi-v7a

          unzip -p "$AAR" \
            prefab/modules/lsplant/libs/android.arm64-v8a/liblsplant.so \
            > /tmp/lsplant-out/arm64-v8a/liblsplant.so

          unzip -p "$AAR" \
            prefab/modules/lsplant/libs/android.armeabi-v7a/liblsplant.so \
            > /tmp/lsplant-out/armeabi-v7a/liblsplant.so

          echo "arm64: $(wc -c < /tmp/lsplant-out/arm64-v8a/liblsplant.so) bytes"
          echo "arm32: $(wc -c < /tmp/lsplant-out/armeabi-v7a/liblsplant.so) bytes"

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: liblsplant-arm64-v8a
          path: /tmp/lsplant-out/arm64-v8a/liblsplant.so
          if-no-files-found: error

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: liblsplant-armeabi-v7a
          path: /tmp/lsplant-out/armeabi-v7a/liblsplant.so
          if-no-files-found: error
